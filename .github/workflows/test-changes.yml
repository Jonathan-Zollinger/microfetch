name: test, build and scan
on:
  pull_request:
    branches:
      - "main"
      - "[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # 4.3.0
        with:
          fetch-depth: 0 # SonarCloud needs a full history to assign issues correctly
      - name: Set up JDK 21
        uses: graalvm/setup-graalvm@7a1da54cb7fdef4ea19f6ecdfa9ecf59dc5a48fe
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'
          native-image-pr-reports: 'true'
      - name: test, build and scan on Ubuntu
        if: ${{matrix.os}} == 'ubuntu-latest'
        run: ./gradlew build sonar nativeCompile --info
      - name: test and build on ${{ matrix.os }}
        if: ${{matrix.os}} != 'ubuntu-latest'
        run: ./gradlew test nativeCompile
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # 4.3.0
      - name: Set up JDK 21
        uses: graalvm/setup-graalvm@7a1da54cb7fdef4ea19f6ecdfa9ecf59dc5a48fe # 1.3.6
        with:
          java-version: '21'
          distribution: 'graalvm-community'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0